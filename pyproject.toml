[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "owneffect"
version = "0.1.0"
description = "How much of a learned intervention's effect is the network's own: the check of 'Whose Effect Is It?'"
readme = "owneffect/README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Toygar Tanyel" }, { name = "Serkan Ayvaz" }]
dependencies = ["torch>=2.1", "numpy>=1.24", "transformers>=5.18"]   # OwnEffect patches transformers' eager kernels

[project.optional-dependencies]
stats = ["scipy>=1.10"]          # t-based intervals in owneffect.stats

[tool.setuptools]
packages = ["owneffect"]
